# Shared backing services for ALL projects — run ONCE:
#   make services-start   (docker compose -p ${SERVICES_PREFIX}services -f docker-compose.services.yml up -d)
#
# Projects connect to these by alias (mariadb / postgres / redis / rabbitmq / minio) over lion-network.
# MinIO is OPTIONAL (compose profile "minio") — off unless COMPOSE_PROFILES=minio is set in .env.
# Upstream stopped publishing minio/minio to Docker Hub, so point MINIO_IMAGE at an image you can
# actually pull (a mirror, your own build, or an S3-compatible alternative) before enabling it.
# Credentials and ports come from jungleforge's .env. SERVICES_PREFIX is empty (unprefixed
# "postgres"/"redis"/"rabbitmq"/"minio"/"services" container/project names) unless set in .env — set it
# (including your own trailing separator, e.g. "myinstance-") if you run more than one instance
# of this control plane on the same host, so the two don't collide.

name: ${SERVICES_PREFIX}services

services:
  mariadb:
    image: mariadb:13
    container_name: ${SERVICES_PREFIX}mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_USER: ${MARIADB_USER:-mariadb}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-mariadb}
      # Runs mariadb-upgrade on boot when the data volume was created by an older major.
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      lion-network:
        aliases:
          - mariadb
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    container_name: ${SERVICES_PREFIX}postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker, so the volume
      # mounts one level up. A new volume name per major: on-disk formats aren't compatible across
      # majors, and the old postgres-data volume is left untouched for a pg_dump/restore.
      - postgres18-data:/var/lib/postgresql
    networks:
      lion-network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: ${SERVICES_PREFIX}redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      lion-network:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ${SERVICES_PREFIX}rabbitmq
    # Fixed (not SERVICES_PREFIX-derived — that value itself can change) — RabbitMQ's Erlang node
    # identity is rabbit@<hostname>, and its Mnesia data directory is keyed on that node name. Without
    # a pinned hostname, Docker assigns a new one on every recreate, so RabbitMQ silently bootstraps a
    # brand-new empty node each time instead of recovering its existing vhosts/queues/users.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      # New volume for 4.x — a 3.x node can't be upgraded in place unless all its feature flags
      # were enabled first; the old rabbitmq-data volume is left untouched.
      - rabbitmq4-data:/var/lib/rabbitmq
    networks:
      lion-network:
        aliases:
          - rabbitmq
    healthcheck:
      # A plain TCP check on the AMQP port — rabbitmq-diagnostics ping spins up a whole extra
      # Erlang VM just to ask the broker "are you alive?", which is expensive enough to matter
      # on a memory-constrained host when it fires every interval, forever.
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: ["minio"]
    container_name: ${SERVICES_PREFIX}minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      lion-network:
        aliases:
          - minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  lion-network:
    name: ${NETWORK_NAME:-lion-network}
    driver: bridge

volumes:
  mariadb-data:
  postgres18-data:
  redis-data:
  rabbitmq4-data:
  minio-data:
